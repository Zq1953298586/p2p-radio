// Top-level build file for the p2p-radio Android app.
// The Rust core (crates/p2p-jni) is compiled separately to .so files
// (see .github/workflows/android.yml) and picked up from
// app/src/main/jniLibs/<abi>/libp2p_jni.so.
plugins {
    id 'com.android.application' version '8.5.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
}
